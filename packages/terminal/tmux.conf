# The browser terminal's tmux: invisible, so the agent owns every key. A browser connection
# owns only an attached client, not the agent.
set -g mouse on
set -g prefix None
unbind C-b
set -g status off
set -g escape-time 0
# Pass modified keys (Shift+Enter and the like) to agents that ask for them.
set -g extended-keys on
set -g default-terminal "tmux-256color"
set -g history-limit 10000
# Copying (a mouse drag, or the agent's own copy) reaches the browser's clipboard as OSC 52.
set -g set-clipboard on
setw -g window-size latest
