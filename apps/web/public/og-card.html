<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>GitTerm OG Card</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: rgba(255, 255, 255, 0.9);
        background-color: #09090b;
        background-image:
          radial-gradient(circle at center, rgba(200, 164, 78, 0.075), transparent 56%),
          radial-gradient(circle, rgba(255, 255, 255, 0.055) 1.2px, transparent 1.5px);
        background-size: auto, 32px 32px;
        font-family: Arial, sans-serif;
      }

      .card {
        width: 100%;
        height: 100%;
        padding: 52px 64px 48px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: monospace;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.3em;
      }

      .brand img {
        width: 28px;
        height: 28px;
      }

      .url {
        color: rgba(255, 255, 255, 0.35);
        font-family: monospace;
        font-size: 13px;
      }

      main {
        text-align: center;
      }

      h1 {
        margin: 83px 0 0;
        font-size: 62px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -0.05em;
      }

      h1 span {
        color: #c8a44e;
      }

      .label {
        color: rgba(255, 255, 255, 0.35);
        font-family: monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .agents-label {
        margin-top: 40px;
      }

      .agents {
        display: flex;
        justify-content: center;
        gap: 64px;
        margin-top: 24px;
      }

      .agent {
        display: flex;
        align-items: center;
        gap: 16px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 22px;
      }

      .agent img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }

      .agent-divider {
        width: 1px;
        height: 34px;
        align-self: center;
        background: rgba(255, 255, 255, 0.16);
      }

      footer {
        margin-top: 52px;
        padding-top: 35px;
        border-top: 1px solid rgba(255, 255, 255, 0.09);
        text-align: center;
      }

      .providers {
        display: flex;
        align-items: stretch;
        margin-top: 25px;
      }

      .provider {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.62);
        font-size: 14px;
        line-height: 1;
      }

      .provider img {
        display: block;
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      .provider span {
        display: block;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <header>
        <div class="brand">
          <img src="./gitterm-railway.svg" alt="" />
          <span>GITTERM</span>
        </div>
        <span class="url">gitterm.dev</span>
      </header>

      <main>
        <h1>Cloud workspaces<br />for coding <span>agents.</span></h1>

        <div class="label agents-label">Agent servers</div>
        <div class="agents">
          <div class="agent"><img src="./opencode.svg" alt="" /><span>OpenCode</span></div>
          <div class="agent-divider" aria-hidden="true"></div>
          <div class="agent"><img src="./t3.svg" alt="" /><span>T3 Chat</span></div>
        </div>
      </main>

      <footer>
        <div class="label">Runs on</div>
        <div class="providers">
          <div class="provider"><img src="./railway.svg" alt="" /><span>Railway</span></div>
          <div class="provider"><img src="./EC2.svg" alt="" /><span>AWS</span></div>
          <div class="provider"><img src="./E2B.svg" alt="" /><span>E2B</span></div>
          <div class="provider"><img src="./daytona.svg" alt="" /><span>Daytona</span></div>
          <div class="provider"><img src="./cloudflare.svg" alt="" /><span>Cloudflare</span></div>
          <div class="provider"><img src="./vercel.svg" alt="" /><span>Vercel</span></div>
          <div class="provider"><img src="./ascii.svg" alt="" /><span>Ascii</span></div>
          <div class="provider"><img src="./exe.png" alt="" /><span>exe.dev</span></div>
        </div>
      </footer>
    </div>
  </body>
</html>
