<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Workspace unavailable · GitTerm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wdth,wght@100..125,400..700&family=Martian+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --background: #101014;
        --card: #16161b;
        --fg: #f3f3f3;
        --fg-3: #aeaeb0;
        --fg-4: #939395;
        --line: rgba(255, 255, 255, 0.11);
        --gold: #d3ad55;
        --error: #f07a72;
        --button: #d3ad55;
        --button-hover: #e0bf6f;
        --button-text: #101014;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --background: #ffffff;
          --card: #f5f5f5;
          --fg: #141414;
          --fg-3: #5b5b5b;
          --fg-4: #767676;
          --line: rgba(0, 0, 0, 0.1);
          --gold: #9a7522;
          --error: #c4352b;
          --button: #141414;
          --button-hover: #2e2e2e;
          --button-text: #ffffff;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Hubot Sans", ui-sans-serif, system-ui, sans-serif;
        background: var(--background);
        color: var(--fg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      main {
        width: 100%;
        max-width: 560px;
        text-align: center;
      }
      .mark {
        display: block;
        width: 28px;
        height: 28px;
        margin: 0 auto 32px;
      }
      .terminal {
        background: #0b0b0e;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 36px;
        text-align: left;
        box-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.45);
      }
      .titlebar {
        position: relative;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 11px 14px;
        background: #1c1c22;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .titlebar i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .titlebar i:nth-child(1) {
        background: #ff5f57;
      }
      .titlebar i:nth-child(2) {
        background: #febc2e;
      }
      .titlebar i:nth-child(3) {
        background: #28c840;
      }
      .titlebar span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: "Martian Mono", ui-monospace, monospace;
        font-size: 11px;
        color: #8b8b92;
        pointer-events: none;
      }
      .session {
        padding: 18px 20px 20px;
        font-family: "Martian Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.9;
        color: #d6d6da;
        overflow-wrap: anywhere;
      }
      .muted {
        color: #8b8b92;
      }
      .prompt {
        color: #d3ad55;
      }
      .failed {
        color: #f07a72;
      }
      h1 {
        font-stretch: 125%;
        font-size: clamp(26px, 6vw, 32px);
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: -0.01em;
        margin-bottom: 12px;
      }
      p {
        max-width: 440px;
        margin-left: auto;
        margin-right: auto;
        color: var(--fg-3);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 12px 24px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        background: var(--button);
        color: var(--button-text);
        padding: 12px 20px;
        border-radius: 8px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        border: 0;
        cursor: pointer;
      }
      .button:hover {
        background: var(--button-hover);
      }
      .link {
        color: var(--fg-3);
        font-size: 15px;
        text-underline-offset: 4px;
      }
      .link:hover {
        color: var(--fg);
      }
      :focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 28 28" aria-label="GitTerm" role="img">
        <path fill="#d3ad55" d="M0 7.5h13v7h7v13H0zM21 .5h7v7h-7z" />
      </svg>
      <div class="terminal" aria-hidden="true">
        <div class="titlebar"><i></i><i></i><i></i><span>~ / zsh</span></div>
        <div class="session">
          <div>
            <span class="prompt">~ $</span> curl
            <span id="address">https://workspace.gitterm.dev</span>
          </div>
          <div><span class="failed">error:</span> workspace unavailable</div>
        </div>
      </div>
      <h1>Workspace unavailable</h1>
      <p>
        It may be paused, deleted or still starting, or you may not have access to it. Try again in
        a moment, or start it from GitTerm.
      </p>
      <div class="actions">
        <a class="button" href="https://gitterm.dev">Go to GitTerm</a>
        <a class="link" href="javascript:location.reload()">Try again</a>
      </div>
    </main>
    <script>
      var match = location.pathname.match(/^\/ws\/[^/]+/);
      document.getElementById("address").textContent = location.origin + (match ? match[0] : "");
    </script>
  </body>
</html>
