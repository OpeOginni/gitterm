name: Publish Bot Image

# One image runs either chat bot: ghcr.io/<owner>/gitterm-bot. It picks Slack or Discord from
# whichever token is set, so `docker run --env-file .env ghcr.io/<owner>/gitterm-bot` is enough.
# Tagged latest, the bot engine's version (packages/bot/package.json) and the commit.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: github.repository == 'OpeOginni/gitterm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: image-production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitterm-bot"
          VERSION=$(jq -r .version packages/bot/package.json)
          TAGS="$IMAGE:latest,$IMAGE:v$VERSION,$IMAGE:$(echo ${{ github.sha }} | cut -c1-7)"
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./packages/bot/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=GitTerm Bot
            org.opencontainers.image.description=Slack and Discord bots that run a coding agent in GitTerm sandboxes.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
