name: Publish Bot Image

# One image runs either chat bot: ghcr.io/<owner>/gitterm-bot. It picks Slack or Discord from
# whichever token is set, so `docker run --env-file .env ghcr.io/<owner>/gitterm-bot` is enough.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish besides latest, e.g. 0.1.0 (optional)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gitterm-bot"
          TAGS="$IMAGE:latest,$IMAGE:$(echo ${{ github.sha }} | cut -c1-7)"
          if [ -n "${{ inputs.version }}" ]; then TAGS="$TAGS,$IMAGE:v${{ inputs.version }}"; fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/bot/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=GitTerm Bot
            org.opencontainers.image.description=Slack and Discord bots that run a coding agent in GitTerm sandboxes.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot
