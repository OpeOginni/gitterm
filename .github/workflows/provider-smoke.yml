name: Provider smoke tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to test
        required: true
        default: e2b
        type: choice
        options:
          - e2b
          - daytona
          - cloudflare
          - vercel
          - ascii
          - exedev
          - railway
          - aws
          - all

concurrency:
  group: provider-smoke-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Test ${{ inputs.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: provider-e2e
    permissions:
      contents: read
    env:
      GITTERM_SERVER_URL: ${{ secrets.GITTERM_SERVER_URL }}
      GITTERM_API_TOKEN: ${{ secrets.GITTERM_API_TOKEN }}
      GITTERM_E2E_REPO: ${{ secrets.GITTERM_E2E_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run provider smoke tests
        run: bun run test:providers --provider "${{ inputs.provider }}"
