name: GitTerm platform images

on:
  workflow_call:
    inputs:
      version_type:
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prefix: ${{ steps.plan.outputs.prefix }}
      candidate: ${{ steps.plan.outputs.candidate }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Plan platform release
        id: plan
        env:
          BUMP: ${{ inputs.version_type }}
        run: |
          set -euo pipefail
          tags=$(git tag --list --sort=-version:refname 'v*')
          previous=$(grep -m1 -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' <<< "$tags" || true)
          previous=${previous:-v0.0.0}
          IFS=. read -r major minor patch <<< "${previous#v}"
          case "$BUMP" in
            major) version="v$((major + 1)).0.0" ;;
            minor) version="v$major.$((minor + 1)).0" ;;
            patch) version="v$major.$minor.$((patch + 1))" ;;
            *) echo "::error::Unknown version bump."; exit 1 ;;
          esac
          {
            echo "version=$version"
            echo "prefix=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/gitterm"
            echo "candidate=candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo 'images=[{"name":"server","app":"server"},{"name":"listener","app":"listener"},{"name":"idle-reaper-worker","app":"worker"},{"name":"proxy","app":"proxy"},{"name":"web","app":"web"}]'
          } >> "$GITHUB_OUTPUT"
          echo "Platform release: $previous → $version from $GITHUB_SHA."

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - name: Protect candidate tags from partial reruns
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.plan.outputs.prefix }}-${{ matrix.name }}:${{ needs.plan.outputs.candidate }}
          labels: |
            org.opencontainers.image.title=GitTerm ${{ matrix.name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      GITTERM_IMAGE_PREFIX: ${{ needs.plan.outputs.prefix }}
      GITTERM_IMAGE_TAG: ${{ needs.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check self-hosted startup and login
        run: bash scripts/release-platform-smoke.sh

  publish:
    needs: [plan, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.prefix }}
      CANDIDATE: ${{ needs.plan.outputs.candidate }}
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish platform image tags
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          existing=$(git ls-remote origin "refs/tags/$VERSION")
          if [[ -n "$existing" ]]; then
            echo "::error::$VERSION already exists. Start a new release."
            exit 1
          fi
          for name in $(jq -r '.[].name' <<< "$IMAGES"); do
            image="$IMAGE_PREFIX-$name"
            docker buildx imagetools create -t "$image:$VERSION" -t "$image:${GITHUB_SHA:0:7}" "$image:$CANDIDATE"
          done
          for name in $(jq -r '.[].name' <<< "$IMAGES"); do
            image="$IMAGE_PREFIX-$name"
            docker buildx imagetools create -t "$image:latest" "$image:$VERSION"
          done
      - name: Tag the source commit and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
          echo "Released \`$VERSION\` from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
