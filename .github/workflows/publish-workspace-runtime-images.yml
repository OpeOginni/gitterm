name: Publish Workspace Runtime Images

# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, E2B_API_KEY

on:
  workflow_dispatch:
    inputs:
      opencode:
        description: "Publish OpenCode Docker images and E2B templates"
        type: boolean
        default: true
      t3code:
        description: "Publish T3Code Docker image and E2B templates"
        type: boolean
        default: true
      opencode_version:
        description: "OpenCode version (latest or exact 2.x version)"
        type: string
        default: "latest"
      t3_version:
        description: "T3 version pin (latest or semver)"
        type: string
        default: "latest"

env:
  DOCKERHUB_NAMESPACE: opeoginni

jobs:
  build-docker:
    if: ${{ inputs.opencode || inputs.t3code }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: opencode
            file: .docker/Opencode.Dockerfile
            context: .docker
            image: gitterm-opencode
            tag: latest
            agent: opencode
          - id: opencode-server
            file: .docker/Opencode.Server.Dockerfile
            context: .docker
            image: gitterm-opencode-server
            tag: latest
            agent: opencode
          - id: opencode-server-aws
            file: .docker/Opencode.Server.AWS.Dockerfile
            context: .docker
            image: gitterm-opencode-server-aws
            tag: latest
            agent: opencode
          - id: t3code-server
            file: .docker/T3Code.Server.Dockerfile
            context: .docker
            image: gitterm-t3code-server
            tag: latest
            agent: t3
          - id: cf-sandbox
            file: packages/api/src/providers/cloudflare/sandbox-worker/Dockerfile
            context: packages/api/src/providers/cloudflare/sandbox-worker
            image: gitterm-cf-sandbox
            tag: "0.12.1"
            agent: cf

    steps:
      - name: Skip unselected agent
        if: ${{ (matrix.agent == 't3' && !inputs.t3code) || (matrix.agent == 'opencode' && !inputs.opencode) }}
        run: |
          echo "Skipping unselected agent image"
          echo "skip=true" >> "$GITHUB_ENV"

      - name: Checkout
        if: ${{ env.skip != 'true' }}
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: ${{ env.skip != 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ env.skip != 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve and validate OpenCode 2
        if: ${{ env.skip != 'true' && matrix.agent == 'opencode' }}
        shell: bash
        env:
          REQUESTED_OPENCODE_VERSION: ${{ inputs.opencode_version }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED_OPENCODE_VERSION:-2}"
          if [ "$REQUESTED" = "2" ] || [ "$REQUESTED" = "latest" ]; then
            RESOLVED=$(npm view @opencode/cli dist-tags.latest)
          else
            RESOLVED=$(npm view "@opencode/cli@$REQUESTED" version)
          fi
          case "$RESOLVED" in
            2.*) ;;
            *) echo "Refusing to build non-OpenCode-2 version: $RESOLVED" >&2; exit 1 ;;
          esac
          echo "Building OpenCode $RESOLVED"
          echo "OPENCODE_V2_VERSION=$RESOLVED" >> "$GITHUB_ENV"

      - name: Resolve and validate T3
        if: ${{ env.skip != 'true' && matrix.agent == 't3' }}
        shell: bash
        env:
          REQUESTED_T3_VERSION: ${{ inputs.t3_version }}
        run: |
          set -euo pipefail
          REQUESTED="${REQUESTED_T3_VERSION:-latest}"
          REQUESTED="${REQUESTED#v}"
          if [ "$REQUESTED" != "latest" ] && ! [[ "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "T3 version must be latest or an exact stable semver" >&2; exit 1
          fi
          RESOLVED=$(npm view "t3@$REQUESTED" version)
          [[ "$RESOLVED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "T3_RESOLVED_VERSION=$RESOLVED" >> "$GITHUB_ENV"

      - name: Build and push
        if: ${{ env.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          pull: true
          no-cache: true
          tags: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ matrix.tag }}
          build-args: |
            OPENCODE_VERSION=${{ env.OPENCODE_V2_VERSION || '2' }}
            OPENCODE_INSTALL_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            T3_VERSION=${{ env.T3_RESOLVED_VERSION || inputs.t3_version }}
            T3_INSTALL_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

  build-e2b:
    if: ${{ (inputs.opencode || inputs.t3code) && needs.build-docker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [build-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build E2B templates
        working-directory: packages/api
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          T3_VERSION: ${{ inputs.t3_version }}
          OPENCODE_VERSION: ${{ inputs.opencode_version }}
          BUILD_OPENCODE: ${{ inputs.opencode }}
          BUILD_T3CODE: ${{ inputs.t3code }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_OPENCODE" = "true" ]; then
            bun run e2b:build --agent opencode
          fi
          if [ "$BUILD_T3CODE" = "true" ]; then
            bun run e2b:build --agent t3code
          fi
