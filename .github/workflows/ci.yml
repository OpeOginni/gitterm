name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build bot packages and dependencies
        run: bun run build:bots

      - name: Test
        run: bun run test

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

  opencode:
    name: OpenCode and T3 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install --frozen-lockfile
      - name: Install matching OpenCode CLI
        run: |
          VERSION=$(bun -p 'require("./packages/agent-runtime/package.json").dependencies["@opencode/client"]')
          npm install --prefix "$RUNNER_TEMP/opencode" "@opencode/cli@$VERSION" --no-audit --fund=false
      - name: Test real OpenCode server
        run: bun run test:opencode
        env:
          OPENCODE_SMOKE_BINARY: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
          OPENCODE_SMOKE_ROOT: ${{ runner.temp }}
      - name: Install T3
        run: npm install --prefix "$RUNNER_TEMP/t3code" t3@0.1.4 --no-audit --fund=false
      - name: Test T3 with OpenCode V2
        run: bun scripts/t3code-smoke.ts
        env:
          T3_SMOKE_BINARY: ${{ runner.temp }}/t3code/node_modules/.bin/t3
          OPENCODE_SMOKE_BINARY: ${{ runner.temp }}/opencode/node_modules/.bin/opencode
          T3_SMOKE_ROOT: ${{ runner.temp }}
