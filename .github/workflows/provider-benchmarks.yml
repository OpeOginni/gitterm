name: Hosted provider benchmarks

on:
  workflow_dispatch:

concurrency:
  group: hosted-provider-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    name: Benchmark ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: provider-e2e
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        provider: [railway, e2b, daytona]
    env:
      GITTERM_SERVER_URL: ${{ secrets.GITTERM_SERVER_URL }}
      GITTERM_API_TOKEN: ${{ secrets.GITTERM_API_TOKEN }}
      GITTERM_E2E_REPO: ${{ secrets.GITTERM_E2E_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run provider benchmark
        run: >-
          bun run benchmark:providers --hosted --provider "${{ matrix.provider }}"
          --output "benchmark-results/${{ matrix.provider }}.json"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-benchmark-${{ matrix.provider }}
          path: benchmark-results/${{ matrix.provider }}.json
          if-no-files-found: error
